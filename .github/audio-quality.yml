name: Audio Quality

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.js"
      - "tests/audio_quality/**"
      - ".github/workflows/audio-quality.yml"
  pull_request:
    paths:
      - "**/*.js"
      - "tests/audio_quality/**"
      - ".github/workflows/audio-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy soundfile pyloudnorm

      - name: Existing deterministic tests
        shell: bash
        run: |
          python tests/static_test.py
          python tests/dependency_audit.py
          python tests/perspective_simulation.py
          for f in tests/*.js; do node "$f"; done

      - name: Generate deterministic audio stimulus
        run: python tests/audio_quality/generate_stimulus.py

      - name: Analyzer identity self-test
        run: python tests/audio_quality/analyzer_selftest.py

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Render actual Web Audio graph
        env:
          DEBUG: pw:browser
        run: node tests/audio_quality/run_playwright.mjs

      - name: Analyze audio quality
        run: python tests/audio_quality/metrics.py

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f tests/audio_quality/results/report.md ]; then
            cat tests/audio_quality/results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f tests/audio_quality/results/render-failure.json ]; then
            echo '### Render failure diagnostic' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat tests/audio_quality/results/render-failure.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audio quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yurika-audio-quality
          path: tests/audio_quality/results/
          if-no-files-found: warn
